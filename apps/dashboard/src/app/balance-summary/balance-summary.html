<div class="balance-card">
  @if (loading()) {
    <span class="balance-card__label">Cargando saldo...</span>
  } @else {
    <span class="balance-card__label">Saldo disponible</span>
    <span class="balance-card__amount">{{ balance() | number:'1.2-2' }} {{ currency() }}</span>
    <span class="balance-card__source">— servido desde Dashboard MFE (puerto 4201)</span>
  }
</div>
